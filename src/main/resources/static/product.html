<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品管理</title>
    <link rel="stylesheet" href="/assets/common.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="brand">
            <h1>冷链损耗分析</h1>
            <p>农产品冷链损耗归因分析系统</p>
        </div>
        <nav class="nav">
            <a href="/index.html">数据概览</a>
            <a href="/batch.html">批次管理</a>
            <a href="/flow.html">流转记录</a>
            <a href="/loss.html">损耗记录</a>
            <a href="/attribution.html">归因分析</a>
            <a href="/trace.html">追溯链路</a>
            <a href="/node.html">节点管理</a>
            <a href="/product.html" class="active">产品管理</a>
        </nav>
    </aside>

    <main class="main">
        <section class="topbar">
            <div>
                <h2>产品管理</h2>
                <div class="meta">维护产品基础信息，支持名称和分类筛选</div>
            </div>
            <div class="d-flex align-items-center">
                <div class="meta me-3" id="currentTime"></div>
                <div id="userInfo"></div>
            </div>
        </section>

        <section class="panel">
            <form id="searchForm" class="form-grid">
                <div class="field">
                    <label for="productName">产品名称</label>
                    <input id="productName" name="productName" placeholder="输入产品名称">
                </div>
                <div class="field">
                    <label for="category">分类</label>
                    <select id="category" name="category">
                        <option value="">全部分类</option>
                        <option value="蔬菜">蔬菜</option>
                        <option value="水果">水果</option>
                        <option value="肉类">肉类</option>
                        <option value="水产">水产</option>
                        <option value="乳制品">乳制品</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
                <div class="actions">
                    <button class="btn btn-primary" type="submit">查询</button>
                    <button class="btn btn-secondary" type="button" id="resetBtn">重置</button>
                </div>
            </form>
        </section>

        <section class="panel">
            <div class="panel-header">
                <h3>产品列表</h3>
                <button class="btn btn-primary" type="button" id="openAddBtn">新增产品</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>产品编码</th>
                        <th>产品名称</th>
                        <th>分类</th>
                        <th>单位</th>
                        <th>储存温度</th>
                        <th>保质期</th>
                        <th>描述</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </section>
    </main>
</div>

<dialog id="editDialog">
    <div class="dialog-body">
        <div class="dialog-header">
            <h3 id="dialogTitle">新增产品</h3>
            <button class="btn btn-ghost btn-sm" type="button" data-close="editDialog">关闭</button>
        </div>
        <form id="editForm" class="form-grid">
            <input type="hidden" id="id" name="id">
            <div class="field">
                <label for="productCode">产品编码</label>
                <input id="productCode" name="productCode" placeholder="输入产品编码">
            </div>
            <div class="field">
                <label for="productNameField">产品名称</label>
                <input id="productNameField" name="productName" placeholder="输入产品名称">
            </div>
            <div class="field">
                <label for="categoryField">分类</label>
                <select id="categoryField" name="category">
                    <option value="">请选择分类</option>
                    <option value="蔬菜">蔬菜</option>
                    <option value="水果">水果</option>
                    <option value="肉类">肉类</option>
                    <option value="水产">水产</option>
                    <option value="乳制品">乳制品</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            <div class="field">
                <label for="unit">单位</label>
                <select id="unit" name="unit">
                    <option value="">请选择单位</option>
                    <option value="kg">kg</option>
                    <option value="吨">吨</option>
                    <option value="箱">箱</option>
                    <option value="件">件</option>
                    <option value="个">个</option>
                </select>
            </div>
            <div class="field">
                <label for="storageTemp">储存温度</label>
                <input id="storageTemp" name="storageTemp" type="number" step="0.01">
            </div>
            <div class="field">
                <label for="shelfLife">保质期（天）</label>
                <input id="shelfLife" name="shelfLife" type="number" min="0">
            </div>
            <div class="field" style="grid-column: 1 / -1;">
                <label for="description">描述</label>
                <textarea id="description" name="description" placeholder="输入产品描述"></textarea>
            </div>
        </form>
        <div class="dialog-actions">
            <button class="btn btn-secondary" type="button" data-close="editDialog">取消</button>
            <button class="btn btn-primary" type="button" id="saveBtn">保存</button>
        </div>
    </div>
</dialog>

<script src="/assets/common.js"></script>
<script>
    function categoryBadge(category) {
        return `<span class="badge badge-primary">${Common.escapeHtml(category || "-")}</span>`;
    }

    async function loadTable() {
        const form = document.getElementById("searchForm");
        const records = await Common.get("/product/list", {
            productName: form.productName.value,
            category: form.category.value,
        });
        const tbody = document.getElementById("tableBody");
        if (!records.length) {
            tbody.innerHTML = '<tr><td colspan="8" class="empty">暂无数据</td></tr>';
            return;
        }
        tbody.innerHTML = records.map((item) => `
            <tr>
                <td><span class="badge badge-primary">${Common.escapeHtml(item.productCode)}</span></td>
                <td>${Common.escapeHtml(item.productName)}</td>
                <td>${categoryBadge(item.category)}</td>
                <td>${Common.escapeHtml(item.unit || "-")}</td>
                <td>${item.storageTemp === null || item.storageTemp === undefined ? "-" : `${Common.formatNumber(item.storageTemp)}℃`}</td>
                <td>${item.shelfLife === null || item.shelfLife === undefined ? "-" : `${item.shelfLife} 天`}</td>
                <td>${Common.escapeHtml(item.description || "-")}</td>
                <td>
                    <div class="table-actions">
                        <button class="btn btn-secondary btn-sm" type="button" onclick="editProduct(${item.id})">编辑</button>
                        <button class="btn btn-danger btn-sm" type="button" onclick="deleteProduct(${item.id})">删除</button>
                    </div>
                </td>
            </tr>
        `).join("");
    }

    async function saveProduct() {
        const form = document.getElementById("editForm");
        const body = {
            productCode: form.productCode.value.trim(),
            productName: Common.must(form.productName.value.trim(), "请输入产品名称"),
            category: Common.must(form.category.value, "请选择分类"),
            unit: Common.must(form.unit.value, "请选择单位"),
            storageTemp: form.storageTemp.value === "" ? null : Number(form.storageTemp.value),
            shelfLife: form.shelfLife.value === "" ? null : Number(form.shelfLife.value),
            description: form.description.value.trim(),
        };
        if (form.id.value) {
            body.id = Number(form.id.value);
            await Common.put("/product/update", body);
        } else {
            await Common.post("/product/add", body);
        }
        Common.closeDialog("editDialog");
        form.reset();
        await loadTable();
        alert("保存成功");
    }

    async function editProduct(id) {
        const data = await Common.get("/product/detail", { id });
        const form = document.getElementById("editForm");
        document.getElementById("dialogTitle").textContent = "编辑产品";
        Common.fillForm(form, data);
        Common.openDialog("editDialog");
    }

    async function deleteProduct(id) {
        if (!confirm("确认删除该产品？")) {
            return;
        }
        await Common.del("/product/delete", { id });
        await loadTable();
        alert("删除成功");
    }

    function showError(error) {
        alert(error.message || "操作失败");
    }

    document.getElementById("searchForm").addEventListener("submit", (event) => {
        event.preventDefault();
        loadTable().catch(showError);
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
        document.getElementById("searchForm").reset();
        loadTable().catch(showError);
    });

    document.getElementById("openAddBtn").addEventListener("click", () => {
        document.getElementById("dialogTitle").textContent = "新增产品";
        document.getElementById("editForm").reset();
        Common.openDialog("editDialog");
    });

    document.getElementById("saveBtn").addEventListener("click", () => {
        saveProduct().catch(showError);
    });

    document.querySelectorAll("[data-close]").forEach((button) => {
        button.addEventListener("click", () => Common.closeDialog(button.dataset.close));
    });

    Common.checkLogin();
    Common.renderUserInfo();
    Common.setClock();
    loadTable().catch(showError);
</script>
</body>
</html>
