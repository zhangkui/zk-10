<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批次管理 - 农产品冷链损耗归因分析系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: #f0f2f5; }
        .sidebar {
            width: 220px;
            height: 100vh;
            background: linear-gradient(180deg, #001529 0%, #002140 100%);
            position: fixed;
            left: 0;
            top: 0;
            color: #fff;
            padding-top: 20px;
        }
        .sidebar .logo {
            text-align: center;
            padding: 20px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }
        .sidebar .logo h4 { font-size: 16px; font-weight: bold; margin: 0; }
        .sidebar .logo p { font-size: 12px; opacity: 0.7; margin: 5px 0 0; }
        .sidebar .menu { list-style: none; }
        .sidebar .menu li { padding: 0; }
        .sidebar .menu li a {
            display: block;
            padding: 14px 25px;
            color: rgba(255,255,255,0.75);
            text-decoration: none;
            transition: all 0.3s;
            border-left: 3px solid transparent;
        }
        .sidebar .menu li a:hover,
        .sidebar .menu li a.active {
            background: rgba(24, 144, 255, 0.2);
            color: #fff;
            border-left-color: #1890ff;
        }
        .sidebar .menu li a i { margin-right: 10px; }
        .main-content {
            margin-left: 220px;
            padding: 20px;
        }
        .header {
            background: #fff;
            padding: 15px 25px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .header h3 { margin: 0; color: #333; }
        .search-box {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .table-box {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: normal;
        }
        .badge-success { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; }
        .badge-warning { background: #fffbe6; color: #faad14; border: 1px solid #ffe58f; }
        .badge-danger { background: #fff1f0; color: #f5222d; border: 1px solid #ffa39e; }
        .badge-info { background: #e6f7ff; color: #1890ff; border: 1px solid #91d5ff; }
        .pagination { justify-content: center; margin-top: 20px; }
        .detail-section {
            margin-bottom: 20px;
        }
        .detail-section h6 {
            color: #333;
            font-weight: bold;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid #eee;
        }
        .detail-item {
            display: flex;
            margin-bottom: 8px;
        }
        .detail-label {
            width: 100px;
            color: #666;
            flex-shrink: 0;
        }
        .detail-value {
            color: #333;
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <h4><i class="bi bi-snow2"></i> 冷链损耗分析</h4>
            <p>Cold Chain Loss Analysis</p>
        </div>
        <ul class="menu">
            <li><a href="index.html"><i class="bi bi-speedometer2"></i> 数据概览</a></li>
            <li><a href="batch.html" class="active"><i class="bi bi-box-seam"></i> 批次管理</a></li>
            <li><a href="flow.html"><i class="bi bi-arrow-left-right"></i> 流转记录</a></li>
            <li><a href="loss.html"><i class="bi bi-exclamation-triangle"></i> 损耗记录</a></li>
            <li><a href="attribution.html"><i class="bi bi-search"></i> 归因分析</a></li>
            <li><a href="trace.html"><i class="bi bi-diagram-3"></i> 可视化追溯</a></li>
            <li><a href="node.html"><i class="bi bi-geo-alt"></i> 节点管理</a></li>
            <li><a href="product.html"><i class="bi bi-bag"></i> 产品管理</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header">
            <h3><i class="bi bi-box-seam"></i> 批次管理</h3>
            <div>
                <span class="text-muted">当前用户：管理员</span>
                <span class="text-muted ms-3" id="currentTime"></span>
            </div>
        </div>

        <div class="search-box">
            <form id="searchForm">
                <div class="row g-3">
                    <div class="col-md-2">
                        <label class="form-label">批次号</label>
                        <input type="text" class="form-control" id="batchNo" placeholder="请输入批次号">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">产品</label>
                        <select class="form-select" id="productId">
                            <option value="">全部产品</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">状态</label>
                        <select class="form-select" id="status">
                            <option value="">全部状态</option>
                            <option value="in_transit">运输中</option>
                            <option value="in_storage">仓储中</option>
                            <option value="completed">已完成</option>
                            <option value="expired">已过期</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">开始日期</label>
                        <input type="date" class="form-control" id="startDate">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">结束日期</label>
                        <input type="date" class="form-control" id="endDate">
                    </div>
                    <div class="col-md-2 d-flex align-items-end gap-2">
                        <button type="submit" class="btn btn-primary flex-fill">
                            <i class="bi bi-search"></i> 查询
                        </button>
                        <button type="button" class="btn btn-secondary" onclick="resetForm()">
                            <i class="bi bi-arrow-clockwise"></i> 重置
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <div class="table-box">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0"><i class="bi bi-list-task"></i> 批次列表</h5>
                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addModal">
                    <i class="bi bi-plus-lg"></i> 新增批次
                </button>
            </div>
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>批次号</th>
                        <th>产品名称</th>
                        <th>数量</th>
                        <th>剩余数量</th>
                        <th>总损耗</th>
                        <th>损耗率</th>
                        <th>状态</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="batchTable">
                </tbody>
            </table>
            <nav>
                <ul class="pagination" id="pagination">
                </ul>
            </nav>
        </div>
    </div>

    <div class="modal fade" id="addModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-plus-lg"></i> 新增批次</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addForm">
                        <div class="mb-3">
                            <label class="form-label">产品 <span class="text-danger">*</span></label>
                            <select class="form-select" id="addProductId" required>
                                <option value="">请选择产品</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">数量 <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="addQuantity" placeholder="请输入数量" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">产地</label>
                            <input type="text" class="form-control" id="addOrigin" placeholder="请输入产地">
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">收获日期</label>
                                <input type="date" class="form-control" id="addHarvestDate">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">到期日期</label>
                                <input type="date" class="form-control" id="addExpireDate">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">备注</label>
                            <textarea class="form-control" id="addRemark" rows="3" placeholder="请输入备注"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="submitAdd()">确定</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="detailModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-info-circle"></i> 批次详情</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="detail-section">
                        <h6>基本信息</h6>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="detail-item">
                                    <span class="detail-label">批次号：</span>
                                    <span class="detail-value" id="detailBatchNo"></span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">产品名称：</span>
                                    <span class="detail-value" id="detailProductName"></span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">数量：</span>
                                    <span class="detail-value" id="detailQuantity"></span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">剩余数量：</span>
                                    <span class="detail-value" id="detailRemaining"></span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">产地：</span>
                                    <span class="detail-value" id="detailOrigin"></span>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="detail-item">
                                    <span class="detail-label">总损耗：</span>
                                    <span class="detail-value text-danger" id="detailTotalLoss"></span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">损耗率：</span>
                                    <span class="detail-value" id="detailLossRate"></span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">收获日期：</span>
                                    <span class="detail-value" id="detailHarvestDate"></span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">到期日期：</span>
                                    <span class="detail-value" id="detailExpireDate"></span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">状态：</span>
                                    <span class="detail-value" id="detailStatus"></span>
                                </div>
                            </div>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">备注：</span>
                            <span class="detail-value" id="detailRemark"></span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">创建时间：</span>
                            <span class="detail-value" id="detailCreateTime"></span>
                        </div>
                    </div>
                    <div class="detail-section">
                        <h6>流转记录</h6>
                        <table class="table table-hover table-sm">
                            <thead>
                                <tr>
                                    <th>来源节点</th>
                                    <th>目标节点</th>
                                    <th>流转数量</th>
                                    <th>操作人</th>
                                    <th>操作时间</th>
                                    <th>运输温度</th>
                                </tr>
                            </thead>
                            <tbody id="flowRecords">
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        axios.defaults.baseURL = API_BASE;

        let currentPage = 1;
        let pageSize = 10;
        let total = 0;

        function updateTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent = now.toLocaleString('zh-CN');
        }
        setInterval(updateTime, 1000);
        updateTime();

        function getStatusText(status) {
            const map = {
                'in_transit': '<span class="badge badge-info">运输中</span>',
                'in_storage': '<span class="badge badge-success">仓储中</span>',
                'completed': '<span class="badge badge-success">已完成</span>',
                'expired': '<span class="badge badge-danger">已过期</span>'
            };
            return map[status] || status;
        }

        async function loadProducts() {
            try {
                const res = await axios.get('/product/list');
                const data = res.data.data;
                const options = data.map(p => `<option value="${p.id}">${p.productName}</option>`).join('');
                document.getElementById('productId').innerHTML = '<option value="">全部产品</option>' + options;
                document.getElementById('addProductId').innerHTML = '<option value="">请选择产品</option>' + options;
            } catch (e) {
                console.error('加载产品列表失败', e);
            }
        }

        async function loadBatchList() {
            try {
                const params = {
                    pageNum: currentPage,
                    pageSize: pageSize,
                    batchNo: document.getElementById('batchNo').value,
                    productId: document.getElementById('productId').value,
                    status: document.getElementById('status').value,
                    startDate: document.getElementById('startDate').value,
                    endDate: document.getElementById('endDate').value
                };
                const res = await axios.get('/batch/page', { params });
                const data = res.data.data;
                total = data.total;
                const records = data.records;
                const tbody = document.getElementById('batchTable');
                tbody.innerHTML = records.map(item => `
                    <tr>
                        <td><span class="badge badge-info">${item.batchNo}</span></td>
                        <td>${item.productName}</td>
                        <td>${item.quantity}</td>
                        <td>${item.remainingQuantity}</td>
                        <td class="text-danger">${item.totalLoss || 0}</td>
                        <td>${item.lossRate || 0}%</td>
                        <td>${getStatusText(item.status)}</td>
                        <td>${item.createTime}</td>
                        <td>
                            <button class="btn btn-sm btn-info" onclick="viewDetail(${item.id})">
                                <i class="bi bi-eye"></i> 详情
                            </button>
                            <button class="btn btn-sm btn-warning" onclick="viewTrace(${item.id})">
                                <i class="bi bi-diagram-3"></i> 追溯
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteBatch(${item.id})">
                                <i class="bi bi-trash"></i> 删除
                            </button>
                        </td>
                    </tr>
                `).join('');
                renderPagination();
            } catch (e) {
                console.error('加载批次列表失败', e);
                alert('加载批次列表失败：' + (e.response?.data?.message || e.message));
            }
        }

        function renderPagination() {
            const totalPages = Math.ceil(total / pageSize);
            const pagination = document.getElementById('pagination');
            let html = '';
            html += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}"><a class="page-link" href="javascript:goPage(${currentPage - 1})">上一页</a></li>`;
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    html += `<li class="page-item ${i === currentPage ? 'active' : ''}"><a class="page-link" href="javascript:goPage(${i})">${i}</a></li>`;
                } else if (i === currentPage - 3 || i === currentPage + 3) {
                    html += '<li class="page-item disabled"><span class="page-link">...</span></li>';
                }
            }
            html += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}"><a class="page-link" href="javascript:goPage(${currentPage + 1})">下一页</a></li>`;
            pagination.innerHTML = html;
        }

        function goPage(page) {
            if (page < 1) return;
            currentPage = page;
            loadBatchList();
        }

        function resetForm() {
            document.getElementById('searchForm').reset();
            currentPage = 1;
            loadBatchList();
        }

        async function submitAdd() {
            const form = document.getElementById('addForm');
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }
            try {
                const data = {
                    productId: document.getElementById('addProductId').value,
                    quantity: document.getElementById('addQuantity').value,
                    origin: document.getElementById('addOrigin').value,
                    harvestDate: document.getElementById('addHarvestDate').value,
                    expireDate: document.getElementById('addExpireDate').value,
                    remark: document.getElementById('addRemark').value
                };
                await axios.post('/batch/add', data);
                alert('新增成功');
                bootstrap.Modal.getInstance(document.getElementById('addModal')).hide();
                form.reset();
                loadBatchList();
            } catch (e) {
                console.error('新增批次失败', e);
                alert('新增失败：' + (e.response?.data?.message || e.message));
            }
        }

        async function viewDetail(id) {
            try {
                const res = await axios.get('/batch/detail?id=' + id);
                const data = res.data.data;
                document.getElementById('detailBatchNo').textContent = data.batchNo;
                document.getElementById('detailProductName').textContent = data.productName;
                document.getElementById('detailQuantity').textContent = data.quantity;
                document.getElementById('detailRemaining').textContent = data.remainingQuantity;
                document.getElementById('detailOrigin').textContent = data.origin || '-';
                document.getElementById('detailTotalLoss').textContent = (data.totalLoss || 0) + ' kg';
                document.getElementById('detailLossRate').textContent = (data.lossRate || 0) + '%';
                document.getElementById('detailHarvestDate').textContent = data.harvestDate || '-';
                document.getElementById('detailExpireDate').textContent = data.expireDate || '-';
                document.getElementById('detailStatus').innerHTML = getStatusText(data.status);
                document.getElementById('detailRemark').textContent = data.remark || '-';
                document.getElementById('detailCreateTime').textContent = data.createTime;

                const flowRes = await axios.get('/flow/list', { params: { batchId: id } });
                const flowData = flowRes.data.data || [];
                document.getElementById('flowRecords').innerHTML = flowData.map(item => `
                    <tr>
                        <td>${item.sourceNodeName}</td>
                        <td>${item.targetNodeName}</td>
                        <td>${item.quantity}</td>
                        <td>${item.operatorName}</td>
                        <td>${item.operateTime}</td>
                        <td>${item.transportTemperature}℃</td>
                    </tr>
                `).join('') || '<tr><td colspan="6" class="text-center text-muted">暂无流转记录</td></tr>';

                new bootstrap.Modal(document.getElementById('detailModal')).show();
            } catch (e) {
                console.error('加载详情失败', e);
                alert('加载详情失败：' + (e.response?.data?.message || e.message));
            }
        }

        function viewTrace(id) {
            window.location.href = 'trace.html?batchId=' + id;
        }

        async function deleteBatch(id) {
            if (!confirm('确定要删除该批次吗？')) return;
            try {
                await axios.delete('/batch/delete?id=' + id);
                alert('删除成功');
                loadBatchList();
            } catch (e) {
                console.error('删除失败', e);
                alert('删除失败：' + (e.response?.data?.message || e.message));
            }
        }

        document.getElementById('searchForm').addEventListener('submit', function(e) {
            e.preventDefault();
            currentPage = 1;
            loadBatchList();
        });

        (async function init() {
            await loadProducts();
            await loadBatchList();
        })();
    </script>
</body>
</html>
