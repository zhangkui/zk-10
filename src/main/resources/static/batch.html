<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批次管理</title>
    <link rel="stylesheet" href="/assets/common.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="brand">
            <h1>冷链损耗分析</h1>
            <p>农产品冷链损耗归因分析系统</p>
        </div>
        <nav class="nav">
            <a href="/index.html">数据概览</a>
            <a href="/batch.html" class="active">批次管理</a>
            <a href="/flow.html">流转记录</a>
            <a href="/loss.html">损耗记录</a>
            <a href="/attribution.html">归因分析</a>
            <a href="/trace.html">追溯链路</a>
            <a href="/node.html">节点管理</a>
            <a href="/product.html">产品管理</a>
        </nav>
    </aside>

    <main class="main">
        <section class="topbar">
            <div>
                <h2>批次管理</h2>
                <div class="meta">管理批次、查看详情和流转记录</div>
            </div>
            <div class="meta" id="currentTime"></div>
        </section>

        <section class="panel">
            <form id="searchForm" class="form-grid">
                <div class="field">
                    <label for="batchNo">批次号</label>
                    <input id="batchNo" name="batchNo" placeholder="输入批次号">
                </div>
                <div class="field">
                    <label for="productId">产品</label>
                    <select id="productId" name="productId"></select>
                </div>
                <div class="field">
                    <label for="status">状态</label>
                    <select id="status" name="status">
                        <option value="">全部状态</option>
                        <option value="in_transit">运输中</option>
                        <option value="in_storage">仓储中</option>
                        <option value="completed">已完成</option>
                        <option value="closed">已关闭</option>
                    </select>
                </div>
                <div class="field">
                    <label for="startDate">开始日期</label>
                    <input id="startDate" name="startDate" type="date">
                </div>
                <div class="field">
                    <label for="endDate">结束日期</label>
                    <input id="endDate" name="endDate" type="date">
                </div>
                <div class="actions">
                    <button class="btn btn-primary" type="submit">查询</button>
                    <button class="btn btn-secondary" type="button" id="resetBtn">重置</button>
                </div>
            </form>
        </section>

        <section class="panel">
            <div class="panel-header">
                <h3>批次列表</h3>
                <button class="btn btn-primary" id="openAddBtn" type="button">新增批次</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>批次号</th>
                        <th>产品名称</th>
                        <th>数量</th>
                        <th>剩余数量</th>
                        <th>总损耗</th>
                        <th>损耗率</th>
                        <th>状态</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody id="batchTable"></tbody>
                </table>
            </div>
            <div class="pagination" id="pagination"></div>
        </section>
    </main>
</div>

<dialog id="editDialog">
    <div class="dialog-body">
        <div class="dialog-header">
            <h3>新增批次</h3>
            <button class="btn btn-ghost btn-sm" type="button" data-close="editDialog">关闭</button>
        </div>
        <form id="editForm" class="form-grid">
            <div class="field">
                <label for="addProductId">产品</label>
                <select id="addProductId" name="productId"></select>
            </div>
            <div class="field">
                <label for="addQuantity">数量</label>
                <input id="addQuantity" name="quantity" type="number" step="0.01" min="0.01">
            </div>
            <div class="field">
                <label for="addOrigin">产地</label>
                <input id="addOrigin" name="origin" placeholder="输入产地">
            </div>
            <div class="field">
                <label for="addHarvestDate">采收日期</label>
                <input id="addHarvestDate" name="harvestDate" type="date">
            </div>
            <div class="field">
                <label for="addExpireDate">到期日期</label>
                <input id="addExpireDate" name="expireDate" type="date">
            </div>
            <div class="field">
                <label for="addStatus">状态</label>
                <select id="addStatus" name="status">
                    <option value="in_storage">仓储中</option>
                    <option value="in_transit">运输中</option>
                    <option value="completed">已完成</option>
                    <option value="closed">已关闭</option>
                </select>
            </div>
            <div class="field" style="grid-column: 1 / -1;">
                <label for="addRemark">备注</label>
                <textarea id="addRemark" name="remark" placeholder="输入备注"></textarea>
            </div>
        </form>
        <div class="dialog-actions">
            <button class="btn btn-secondary" type="button" data-close="editDialog">取消</button>
            <button class="btn btn-primary" type="button" id="saveBtn">保存</button>
        </div>
    </div>
</dialog>

<dialog id="detailDialog">
    <div class="dialog-body">
        <div class="dialog-header">
            <h3>批次详情</h3>
            <button class="btn btn-ghost btn-sm" type="button" data-close="detailDialog">关闭</button>
        </div>
        <div class="detail-grid" id="detailInfo"></div>
        <div class="panel" style="margin-top: 18px; margin-bottom: 0;">
            <div class="panel-header">
                <h4>流转记录</h4>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>来源节点</th>
                        <th>目标节点</th>
                        <th>流转数量</th>
                        <th>操作人</th>
                        <th>操作时间</th>
                        <th>运输温度</th>
                    </tr>
                    </thead>
                    <tbody id="detailFlows"></tbody>
                </table>
            </div>
        </div>
    </div>
</dialog>

<script src="/assets/common.js"></script>
<script>
    const state = {
        pageNum: 1,
        pageSize: 10,
    };

    function statusBadge(status) {
        const map = {
            in_transit: '<span class="badge badge-primary">运输中</span>',
            in_storage: '<span class="badge badge-success">仓储中</span>',
            completed: '<span class="badge badge-success">已完成</span>',
            closed: '<span class="badge badge-warning">已关闭</span>',
        };
        return map[status] || Common.escapeHtml(status || "-");
    }

    function collectSearch() {
        const form = document.getElementById("searchForm");
        return {
            pageNum: state.pageNum,
            pageSize: state.pageSize,
            batchNo: form.batchNo.value,
            productId: form.productId.value,
            status: form.status.value,
            startDate: form.startDate.value,
            endDate: form.endDate.value,
        };
    }

    async function loadProducts() {
        const products = await Common.get("/product/list");
        const render = (item) => `<option value="${item.id}">${Common.escapeHtml(item.productName)}</option>`;
        Common.renderOptions(document.getElementById("productId"), products, render, "全部产品");
        Common.renderOptions(document.getElementById("addProductId"), products, render, "请选择产品");
    }

    async function loadTable() {
        const page = await Common.get("/batch/page", collectSearch());
        const tbody = document.getElementById("batchTable");
        const records = page.records || [];
        if (!records.length) {
            tbody.innerHTML = '<tr><td colspan="9" class="empty">暂无数据</td></tr>';
        } else {
            tbody.innerHTML = records.map((item) => `
                <tr>
                    <td><span class="badge badge-primary">${Common.escapeHtml(item.batchNo)}</span></td>
                    <td>${Common.escapeHtml(item.productName)}</td>
                    <td>${Common.formatNumber(item.quantity)}</td>
                    <td>${Common.formatNumber(item.remainingQuantity)}</td>
                    <td class="danger">${Common.formatNumber(item.totalLoss)}</td>
                    <td>${Common.formatNumber(item.lossRate)}%</td>
                    <td>${statusBadge(item.status)}</td>
                    <td>${Common.formatDateTime(item.createTime)}</td>
                    <td>
                        <div class="table-actions">
                            <button class="btn btn-secondary btn-sm" type="button" onclick="viewDetail(${item.id})">详情</button>
                            <button class="btn btn-ghost btn-sm" type="button" onclick="location.href='/trace.html?batchId=${item.id}'">追溯</button>
                        </div>
                    </td>
                </tr>
            `).join("");
        }
        Common.renderPager(document.getElementById("pagination"), page, (pageNum) => {
            state.pageNum = pageNum;
            loadTable().catch(showError);
        });
    }

    async function saveBatch() {
        const form = document.getElementById("editForm");
        const body = {
            productId: Number(Common.must(form.productId.value, "请选择产品")),
            quantity: Number(Common.must(form.quantity.value, "请输入数量")),
            origin: form.origin.value.trim(),
            harvestDate: form.harvestDate.value || null,
            expireDate: form.expireDate.value || null,
            status: form.status.value,
            remark: form.remark.value.trim(),
        };
        await Common.post("/batch/add", body);
        form.reset();
        form.status.value = "in_storage";
        Common.closeDialog("editDialog");
        state.pageNum = 1;
        await loadTable();
        alert("新增批次成功");
    }

    async function viewDetail(id) {
        const data = await Common.get("/batch/detail", { id });
        const flowData = await Common.get("/flow/list", { batchId: id });
        document.getElementById("detailInfo").innerHTML = [
            ["批次号", data.batchNo],
            ["产品名称", data.productName],
            ["数量", Common.formatNumber(data.quantity)],
            ["剩余数量", Common.formatNumber(data.remainingQuantity)],
            ["总损耗", `${Common.formatNumber(data.totalLoss)} kg`],
            ["损耗率", `${Common.formatNumber(data.lossRate)}%`],
            ["产地", data.origin || "-"],
            ["采收日期", Common.formatDate(data.harvestDate)],
            ["到期日期", Common.formatDate(data.expireDate)],
            ["状态", statusBadge(data.status)],
            ["备注", data.remark || "-"],
            ["创建时间", Common.formatDateTime(data.createTime)],
        ].map(([label, value]) => `
            <div class="detail-item">
                <strong>${label}</strong>
                <div>${value}</div>
            </div>
        `).join("");

        const flowTable = document.getElementById("detailFlows");
        if (!flowData.length) {
            flowTable.innerHTML = '<tr><td colspan="6" class="empty">暂无流转记录</td></tr>';
        } else {
            flowTable.innerHTML = flowData.map((item) => `
                <tr>
                    <td>${Common.escapeHtml(item.sourceNodeName || "-")}</td>
                    <td>${Common.escapeHtml(item.targetNodeName || "-")}</td>
                    <td>${Common.formatNumber(item.flowQuantity ?? item.quantity)}</td>
                    <td>${Common.escapeHtml(item.operatorName || "-")}</td>
                    <td>${Common.formatDateTime(item.operateTime)}</td>
                    <td>${item.transportTemperature === null || item.transportTemperature === undefined ? "-" : `${Common.formatNumber(item.transportTemperature)}℃`}</td>
                </tr>
            `).join("");
        }
        Common.openDialog("detailDialog");
    }

    function showError(error) {
        alert(error.message || "操作失败");
    }

    document.getElementById("searchForm").addEventListener("submit", (event) => {
        event.preventDefault();
        state.pageNum = 1;
        loadTable().catch(showError);
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
        document.getElementById("searchForm").reset();
        state.pageNum = 1;
        loadTable().catch(showError);
    });

    document.getElementById("openAddBtn").addEventListener("click", () => {
        const form = document.getElementById("editForm");
        form.reset();
        form.status.value = "in_storage";
        Common.openDialog("editDialog");
    });

    document.getElementById("saveBtn").addEventListener("click", () => {
        saveBatch().catch(showError);
    });

    document.querySelectorAll("[data-close]").forEach((button) => {
        button.addEventListener("click", () => Common.closeDialog(button.dataset.close));
    });

    Common.setClock();
    loadProducts().then(loadTable).catch(showError);
</script>
</body>
</html>
