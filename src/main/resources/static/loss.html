<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>损耗记录</title>
    <link rel="stylesheet" href="/assets/common.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="brand">
            <h1>冷链损耗分析</h1>
            <p>农产品冷链损耗归因分析系统</p>
        </div>
        <nav class="nav">
            <a href="/index.html">数据概览</a>
            <a href="/batch.html">批次管理</a>
            <a href="/flow.html">流转记录</a>
            <a href="/loss.html" class="active">损耗记录</a>
            <a href="/attribution.html">归因分析</a>
            <a href="/trace.html">追溯链路</a>
            <a href="/node.html">节点管理</a>
            <a href="/product.html">产品管理</a>
        </nav>
    </aside>

    <main class="main">
        <section class="topbar">
            <div>
                <h2>损耗记录</h2>
                <div class="meta">登记损耗、跟踪处理状态并跳转归因分析</div>
            </div>
            <div class="d-flex align-items-center">
                <div class="meta me-3" id="currentTime"></div>
                <div id="userInfo"></div>
            </div>
        </section>

        <section class="panel">
            <form id="searchForm" class="form-grid">
                <div class="field">
                    <label for="batchNo">批次号</label>
                    <input id="batchNo" name="batchNo" placeholder="输入批次号">
                </div>
                <div class="field">
                    <label for="lossType">损耗类型</label>
                    <select id="lossType" name="lossType">
                        <option value="">全部类型</option>
                        <option value="变质">变质</option>
                        <option value="损坏">损坏</option>
                        <option value="丢失">丢失</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
                <div class="field">
                    <label for="status">状态</label>
                    <select id="status" name="status">
                        <option value="">全部状态</option>
                        <option value="pending">待处理</option>
                        <option value="processed">已处理</option>
                        <option value="attributed">已归因</option>
                    </select>
                </div>
                <div class="field">
                    <label for="startDate">开始日期</label>
                    <input id="startDate" name="startDate" type="date">
                </div>
                <div class="field">
                    <label for="endDate">结束日期</label>
                    <input id="endDate" name="endDate" type="date">
                </div>
                <div class="actions">
                    <button class="btn btn-primary" type="submit">查询</button>
                    <button class="btn btn-secondary" type="button" id="resetBtn">重置</button>
                </div>
            </form>
        </section>

        <section class="panel">
            <div class="panel-header">
                <h3>损耗列表</h3>
                <button class="btn btn-primary" type="button" id="openAddBtn">新增损耗</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>批次号</th>
                        <th>产品</th>
                        <th>节点</th>
                        <th>损耗数量</th>
                        <th>损耗率</th>
                        <th>损耗类型</th>
                        <th>状态</th>
                        <th>发现时间</th>
                        <th>已归因</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody id="lossTable"></tbody>
                </table>
            </div>
            <div class="pagination" id="pagination"></div>
        </section>
    </main>
</div>

<dialog id="editDialog">
    <div class="dialog-body">
        <div class="dialog-header">
            <h3>新增损耗记录</h3>
            <button class="btn btn-ghost btn-sm" type="button" data-close="editDialog">关闭</button>
        </div>
        <form id="editForm" class="form-grid">
            <div class="field">
                <label for="batchId">批次</label>
                <select id="batchId" name="batchId"></select>
            </div>
            <div class="field">
                <label for="nodeId">节点</label>
                <select id="nodeId" name="nodeId"></select>
            </div>
            <div class="field">
                <label for="flowId">关联流转记录</label>
                <select id="flowId" name="flowId"></select>
            </div>
            <div class="field">
                <label for="operatorId">记录人</label>
                <select id="operatorId" name="operatorId"></select>
            </div>
            <div class="field">
                <label for="lossQuantity">损耗数量</label>
                <input id="lossQuantity" name="lossQuantity" type="number" step="0.01" min="0.01">
            </div>
            <div class="field">
                <label for="discoverTime">发现时间</label>
                <input id="discoverTime" name="discoverTime" type="datetime-local">
            </div>
            <div class="field">
                <label for="lossTypeField">损耗类型</label>
                <select id="lossTypeField" name="lossType">
                    <option value="">请选择损耗类型</option>
                    <option value="变质">变质</option>
                    <option value="损坏">损坏</option>
                    <option value="丢失">丢失</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            <div class="field" style="grid-column: 1 / -1;">
                <label for="lossReason">损耗原因</label>
                <textarea id="lossReason" name="lossReason" placeholder="输入损耗原因"></textarea>
            </div>
            <div class="field" style="grid-column: 1 / -1;">
                <label for="remark">备注</label>
                <textarea id="remark" name="remark" placeholder="输入备注"></textarea>
            </div>
        </form>
        <div class="dialog-actions">
            <button class="btn btn-secondary" type="button" data-close="editDialog">取消</button>
            <button class="btn btn-primary" type="button" id="saveBtn">保存</button>
        </div>
    </div>
</dialog>

<script src="/assets/common.js"></script>
<script>
    const state = {
        pageNum: 1,
        pageSize: 10,
    };

    function statusBadge(status) {
        const map = {
            pending: '<span class="badge badge-warning">待处理</span>',
            processed: '<span class="badge badge-primary">已处理</span>',
            attributed: '<span class="badge badge-success">已归因</span>',
        };
        return map[status] || Common.escapeHtml(status || "-");
    }

    function collectSearch() {
        const form = document.getElementById("searchForm");
        return {
            pageNum: state.pageNum,
            pageSize: state.pageSize,
            batchNo: form.batchNo.value,
            lossType: form.lossType.value,
            status: form.status.value,
            startDate: form.startDate.value,
            endDate: form.endDate.value,
        };
    }

    async function loadBatches() {
        const batches = await Common.get("/batch/list");
        Common.renderOptions(
            document.getElementById("batchId"),
            batches,
            (item) => `<option value="${item.id}">${Common.escapeHtml(item.batchNo)} - ${Common.escapeHtml(item.productName)}</option>`,
            "请选择批次"
        );
    }

    async function loadNodes() {
        const nodes = await Common.get("/node/list");
        Common.renderOptions(
            document.getElementById("nodeId"),
            nodes,
            (item) => `<option value="${item.id}">${Common.escapeHtml(item.nodeName)}</option>`,
            "请选择节点"
        );
    }

    async function loadUsers() {
        const users = await Common.loadUsers();
        Common.renderOptions(
            document.getElementById("operatorId"),
            users,
            (item) => `<option value="${item.id}">${Common.escapeHtml(item.realName)} (${Common.escapeHtml(item.username)})</option>`,
            "请选择记录人"
        );
    }

    async function loadFlows(batchId) {
        if (!batchId) {
            Common.renderOptions(document.getElementById("flowId"), [], () => "", "无关联流转");
            return;
        }
        const flows = await Common.get("/flow/list", { batchId });
        Common.renderOptions(
            document.getElementById("flowId"),
            flows,
            (item) => `<option value="${item.id}">${Common.escapeHtml(item.sourceNodeName || "起点")} -> ${Common.escapeHtml(item.targetNodeName || "终点")} (${Common.formatDateTime(item.operateTime)})</option>`,
            "不关联流转"
        );
    }

    async function loadTable() {
        const page = await Common.get("/loss/page", collectSearch());
        const tbody = document.getElementById("lossTable");
        const records = page.records || [];
        if (!records.length) {
            tbody.innerHTML = '<tr><td colspan="10" class="empty">暂无数据</td></tr>';
        } else {
            tbody.innerHTML = records.map((item) => `
                <tr>
                    <td><span class="badge badge-primary">${Common.escapeHtml(item.batchNo)}</span></td>
                    <td>${Common.escapeHtml(item.productName || "-")}</td>
                    <td>${Common.escapeHtml(item.nodeName || "-")}</td>
                    <td class="danger">${Common.formatNumber(item.lossQuantity)}</td>
                    <td>${Common.formatNumber(item.lossRate)}%</td>
                    <td>${Common.escapeHtml(item.lossType || "-")}</td>
                    <td>${statusBadge(item.status)}</td>
                    <td>${Common.formatDateTime(item.discoverTime)}</td>
                    <td>${Number(item.hasAttribution) === 1 ? '<span class="badge badge-success">是</span>' : '<span class="badge badge-warning">否</span>'}</td>
                    <td>
                        <div class="table-actions">
                            <button class="btn btn-secondary btn-sm" type="button" onclick="location.href='/attribution.html?lossId=${item.id}'">归因</button>
                            <button class="btn btn-danger btn-sm" type="button" onclick="deleteLoss(${item.id})">删除</button>
                        </div>
                    </td>
                </tr>
            `).join("");
        }

        Common.renderPager(document.getElementById("pagination"), page, (pageNum) => {
            state.pageNum = pageNum;
            loadTable().catch(showError);
        });
    }

    async function saveLoss() {
        const form = document.getElementById("editForm");
        await Common.post("/loss/add", {
            batchId: Number(Common.must(form.batchId.value, "请选择批次")),
            nodeId: Number(Common.must(form.nodeId.value, "请选择节点")),
            flowId: form.flowId.value ? Number(form.flowId.value) : null,
            operatorId: Number(Common.must(form.operatorId.value, "请选择记录人")),
            lossQuantity: Number(Common.must(form.lossQuantity.value, "请输入损耗数量")),
            lossType: Common.must(form.lossType.value, "请选择损耗类型"),
            lossReason: form.lossReason.value.trim(),
            discoverTime: form.discoverTime.value || null,
            remark: form.remark.value.trim(),
        });
        form.reset();
        Common.closeDialog("editDialog");
        state.pageNum = 1;
        await loadTable();
        alert("新增损耗成功");
    }

    async function deleteLoss(id) {
        if (!confirm("确认删除这条损耗记录？")) {
            return;
        }
        await Common.del("/loss/delete", { id });
        await loadTable();
        alert("删除成功");
    }

    function showError(error) {
        alert(error.message || "操作失败");
    }

    document.getElementById("batchId").addEventListener("change", (event) => {
        loadFlows(event.target.value).catch(showError);
    });

    document.getElementById("searchForm").addEventListener("submit", (event) => {
        event.preventDefault();
        state.pageNum = 1;
        loadTable().catch(showError);
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
        document.getElementById("searchForm").reset();
        state.pageNum = 1;
        loadTable().catch(showError);
    });

    document.getElementById("openAddBtn").addEventListener("click", () => {
        const form = document.getElementById("editForm");
        form.reset();
        form.discoverTime.value = Common.formatDateTimeInput(new Date().toISOString());
        loadFlows("").catch(showError);
        Common.openDialog("editDialog");
    });

    document.getElementById("saveBtn").addEventListener("click", () => {
        saveLoss().catch(showError);
    });

    document.querySelectorAll("[data-close]").forEach((button) => {
        button.addEventListener("click", () => Common.closeDialog(button.dataset.close));
    });

    Common.checkLogin();
    Common.renderUserInfo();
    Common.setClock();
    Promise.all([loadBatches(), loadNodes(), loadUsers()]).then(loadTable).catch(showError);
</script>
</body>
</html>
