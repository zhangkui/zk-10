<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>节点管理</title>
    <link rel="stylesheet" href="/assets/common.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="brand">
            <h1>冷链损耗分析</h1>
            <p>农产品冷链损耗归因分析系统</p>
        </div>
        <nav class="nav">
            <a href="/index.html">数据概览</a>
            <a href="/batch.html">批次管理</a>
            <a href="/flow.html">流转记录</a>
            <a href="/loss.html">损耗记录</a>
            <a href="/attribution.html">归因分析</a>
            <a href="/trace.html">追溯链路</a>
            <a href="/node.html" class="active">节点管理</a>
            <a href="/product.html">产品管理</a>
        </nav>
    </aside>

    <main class="main">
        <section class="topbar">
            <div>
                <h2>节点管理</h2>
                <div class="meta">筛选、维护冷链节点基础信息</div>
            </div>
            <div class="d-flex align-items-center">
                <div class="meta me-3" id="currentTime"></div>
                <div id="userInfo"></div>
            </div>
        </section>

        <section class="panel">
            <form id="searchForm" class="form-grid">
                <div class="field">
                    <label for="nodeName">节点名称</label>
                    <input id="nodeName" name="nodeName" placeholder="输入节点名称">
                </div>
                <div class="field">
                    <label for="nodeType">节点类型</label>
                    <select id="nodeType" name="nodeType">
                        <option value="">全部类型</option>
                        <option value="supplier">供应商</option>
                        <option value="warehouse">仓库</option>
                        <option value="transit">中转节点</option>
                        <option value="store">门店</option>
                    </select>
                </div>
                <div class="field">
                    <label for="status">状态</label>
                    <select id="status" name="status">
                        <option value="">全部状态</option>
                        <option value="1">正常</option>
                        <option value="0">停用</option>
                    </select>
                </div>
                <div class="actions">
                    <button class="btn btn-primary" type="submit">查询</button>
                    <button class="btn btn-secondary" type="button" id="resetBtn">重置</button>
                </div>
            </form>
        </section>

        <section class="panel">
            <div class="panel-header">
                <h3>节点列表</h3>
                <button class="btn btn-primary" type="button" id="openAddBtn">新增节点</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>节点编码</th>
                        <th>节点名称</th>
                        <th>节点类型</th>
                        <th>地址</th>
                        <th>负责人</th>
                        <th>电话</th>
                        <th>温度</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
            <div class="pagination" id="pagination"></div>
        </section>
    </main>
</div>

<dialog id="editDialog">
    <div class="dialog-body">
        <div class="dialog-header">
            <h3 id="dialogTitle">新增节点</h3>
            <button class="btn btn-ghost btn-sm" type="button" data-close="editDialog">关闭</button>
        </div>
        <form id="editForm" class="form-grid">
            <input type="hidden" id="id" name="id">
            <div class="field">
                <label for="nodeCode">节点编码</label>
                <input id="nodeCode" name="nodeCode" placeholder="输入节点编码">
            </div>
            <div class="field">
                <label for="nodeNameField">节点名称</label>
                <input id="nodeNameField" name="nodeName" placeholder="输入节点名称">
            </div>
            <div class="field">
                <label for="nodeTypeField">节点类型</label>
                <select id="nodeTypeField" name="nodeType">
                    <option value="">请选择节点类型</option>
                    <option value="supplier">供应商</option>
                    <option value="warehouse">仓库</option>
                    <option value="transit">中转节点</option>
                    <option value="store">门店</option>
                </select>
            </div>
            <div class="field">
                <label for="address">地址</label>
                <input id="address" name="address" placeholder="输入地址">
            </div>
            <div class="field">
                <label for="manager">负责人</label>
                <input id="manager" name="manager" placeholder="输入负责人">
            </div>
            <div class="field">
                <label for="phone">电话</label>
                <input id="phone" name="phone" placeholder="输入电话">
            </div>
            <div class="field">
                <label for="temperature">温度</label>
                <input id="temperature" name="temperature" type="number" step="0.01">
            </div>
            <div class="field">
                <label for="statusField">状态</label>
                <select id="statusField" name="status">
                    <option value="1">正常</option>
                    <option value="0">停用</option>
                </select>
            </div>
        </form>
        <div class="dialog-actions">
            <button class="btn btn-secondary" type="button" data-close="editDialog">取消</button>
            <button class="btn btn-primary" type="button" id="saveBtn">保存</button>
        </div>
    </div>
</dialog>

<script src="/assets/common.js"></script>
<script>
    const state = { pageNum: 1, pageSize: 10 };

    function typeBadge(type) {
        const map = {
            supplier: '<span class="badge badge-success">供应商</span>',
            warehouse: '<span class="badge badge-primary">仓库</span>',
            transit: '<span class="badge badge-warning">中转节点</span>',
            store: '<span class="badge badge-primary">门店</span>',
        };
        return map[type] || Common.escapeHtml(type || "-");
    }

    function statusBadge(status) {
        return Number(status) === 1
            ? '<span class="badge badge-success">正常</span>'
            : '<span class="badge badge-warning">停用</span>';
    }

    function collectSearch() {
        const form = document.getElementById("searchForm");
        return {
            pageNum: state.pageNum,
            pageSize: state.pageSize,
            nodeName: form.nodeName.value,
            nodeType: form.nodeType.value,
            status: form.status.value,
        };
    }

    async function loadTable() {
        const page = await Common.get("/node/page", collectSearch());
        const tbody = document.getElementById("tableBody");
        const records = page.records || [];
        if (!records.length) {
            tbody.innerHTML = '<tr><td colspan="9" class="empty">暂无数据</td></tr>';
        } else {
            tbody.innerHTML = records.map((item) => `
                <tr>
                    <td><span class="badge badge-primary">${Common.escapeHtml(item.nodeCode)}</span></td>
                    <td>${Common.escapeHtml(item.nodeName)}</td>
                    <td>${typeBadge(item.nodeType)}</td>
                    <td>${Common.escapeHtml(item.address || "-")}</td>
                    <td>${Common.escapeHtml(item.manager || "-")}</td>
                    <td>${Common.escapeHtml(item.phone || "-")}</td>
                    <td>${item.temperature === null || item.temperature === undefined ? "-" : `${Common.formatNumber(item.temperature)}℃`}</td>
                    <td>${statusBadge(item.status)}</td>
                    <td>
                        <div class="table-actions">
                            <button class="btn btn-secondary btn-sm" type="button" onclick="editNode(${item.id})">编辑</button>
                            <button class="btn btn-danger btn-sm" type="button" onclick="deleteNode(${item.id})">删除</button>
                        </div>
                    </td>
                </tr>
            `).join("");
        }
        Common.renderPager(document.getElementById("pagination"), page, (pageNum) => {
            state.pageNum = pageNum;
            loadTable().catch(showError);
        });
    }

    async function saveNode() {
        const form = document.getElementById("editForm");
        const body = {
            nodeCode: form.nodeCode.value.trim(),
            nodeName: Common.must(form.nodeName.value.trim(), "请输入节点名称"),
            nodeType: Common.must(form.nodeType.value, "请选择节点类型"),
            address: form.address.value.trim(),
            manager: form.manager.value.trim(),
            phone: form.phone.value.trim(),
            temperature: form.temperature.value === "" ? null : Number(form.temperature.value),
            status: Number(form.status.value || 1),
        };
        if (form.id.value) {
            body.id = Number(form.id.value);
            await Common.put("/node/update", body);
        } else {
            await Common.post("/node/add", body);
        }
        Common.closeDialog("editDialog");
        form.reset();
        state.pageNum = 1;
        await loadTable();
        alert("保存成功");
    }

    async function editNode(id) {
        const data = await Common.get("/node/detail", { id });
        const form = document.getElementById("editForm");
        document.getElementById("dialogTitle").textContent = "编辑节点";
        Common.fillForm(form, {
            id: data.id,
            nodeCode: data.nodeCode,
            nodeName: data.nodeName,
            nodeType: data.nodeType,
            address: data.address,
            manager: data.manager,
            phone: data.phone,
            temperature: data.temperature,
            status: data.status,
        });
        Common.openDialog("editDialog");
    }

    async function deleteNode(id) {
        if (!confirm("确认删除该节点？")) {
            return;
        }
        await Common.del("/node/delete", { id });
        await loadTable();
        alert("删除成功");
    }

    function showError(error) {
        alert(error.message || "操作失败");
    }

    document.getElementById("searchForm").addEventListener("submit", (event) => {
        event.preventDefault();
        state.pageNum = 1;
        loadTable().catch(showError);
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
        document.getElementById("searchForm").reset();
        state.pageNum = 1;
        loadTable().catch(showError);
    });

    document.getElementById("openAddBtn").addEventListener("click", () => {
        document.getElementById("dialogTitle").textContent = "新增节点";
        const form = document.getElementById("editForm");
        form.reset();
        form.status.value = "1";
        Common.openDialog("editDialog");
    });

    document.getElementById("saveBtn").addEventListener("click", () => {
        saveNode().catch(showError);
    });

    document.querySelectorAll("[data-close]").forEach((button) => {
        button.addEventListener("click", () => Common.closeDialog(button.dataset.close));
    });

    Common.checkLogin();
    Common.renderUserInfo();
    Common.setClock();
    loadTable().catch(showError);
</script>
</body>
</html>
