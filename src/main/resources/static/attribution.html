<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>归因分析</title>
    <link rel="stylesheet" href="/assets/common.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="brand">
            <h1>冷链损耗分析</h1>
            <p>农产品冷链损耗归因分析系统</p>
        </div>
        <nav class="nav">
            <a href="/index.html">数据概览</a>
            <a href="/batch.html">批次管理</a>
            <a href="/flow.html">流转记录</a>
            <a href="/loss.html">损耗记录</a>
            <a href="/attribution.html" class="active">归因分析</a>
            <a href="/trace.html">追溯链路</a>
            <a href="/node.html">节点管理</a>
            <a href="/product.html">产品管理</a>
        </nav>
    </aside>

    <main class="main">
        <section class="topbar">
            <div>
                <h2>归因分析</h2>
                <div class="meta">查看归因结果，支持自动分析并新增归因记录</div>
            </div>
            <div class="meta" id="currentTime"></div>
        </section>

        <section class="panel">
            <form id="searchForm" class="form-grid">
                <div class="field">
                    <label for="batchNo">批次号</label>
                    <input id="batchNo" name="batchNo" placeholder="输入批次号">
                </div>
                <div class="field">
                    <label for="responsibilityType">责任类型</label>
                    <select id="responsibilityType" name="responsibilityType">
                        <option value="">全部类型</option>
                        <option value="温度控制不当">温度控制不当</option>
                        <option value="仓储管理不当">仓储管理不当</option>
                        <option value="运输时长过长">运输时长过长</option>
                        <option value="操作失误">操作失误</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
                <div class="field">
                    <label for="responsibilityLevel">责任等级</label>
                    <select id="responsibilityLevel" name="responsibilityLevel">
                        <option value="">全部等级</option>
                        <option value="primary">主要责任</option>
                        <option value="secondary">次要责任</option>
                        <option value="none">无责任</option>
                    </select>
                </div>
                <div class="field">
                    <label for="status">状态</label>
                    <select id="status" name="status">
                        <option value="">全部状态</option>
                        <option value="confirmed">已确认</option>
                        <option value="appealed">已申诉</option>
                        <option value="revised">已修订</option>
                    </select>
                </div>
                <div class="actions">
                    <button class="btn btn-primary" type="submit">查询</button>
                    <button class="btn btn-secondary" type="button" id="resetBtn">重置</button>
                </div>
            </form>
        </section>

        <section class="panel">
            <div class="panel-header">
                <h3>归因列表</h3>
                <button class="btn btn-primary" type="button" id="openAddBtn">新增归因</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>批次号</th>
                        <th>损耗量</th>
                        <th>责任方</th>
                        <th>责任类型</th>
                        <th>责任等级</th>
                        <th>置信度</th>
                        <th>分析时间</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
            <div class="pagination" id="pagination"></div>
        </section>
    </main>
</div>

<dialog id="editDialog">
    <div class="dialog-body">
        <div class="dialog-header">
            <h3>新增归因分析</h3>
            <button class="btn btn-ghost btn-sm" type="button" data-close="editDialog">关闭</button>
        </div>
        <form id="editForm" class="form-grid">
            <div class="field" style="grid-column: 1 / -1;">
                <label for="lossId">损耗记录</label>
                <div class="toolbar">
                    <select id="lossId" name="lossId" style="flex: 1;"></select>
                    <button class="btn btn-secondary" type="button" id="analyzeBtn">自动分析</button>
                </div>
            </div>
            <div class="field">
                <label for="responsibleParty">责任方</label>
                <input id="responsibleParty" name="responsibleParty" placeholder="输入责任方">
            </div>
            <div class="field">
                <label for="responsibilityTypeField">责任类型</label>
                <select id="responsibilityTypeField" name="responsibilityType">
                    <option value="">请选择责任类型</option>
                    <option value="温度控制不当">温度控制不当</option>
                    <option value="仓储管理不当">仓储管理不当</option>
                    <option value="运输时长过长">运输时长过长</option>
                    <option value="操作失误">操作失误</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            <div class="field">
                <label for="responsibilityLevelField">责任等级</label>
                <select id="responsibilityLevelField" name="responsibilityLevel">
                    <option value="">请选择责任等级</option>
                    <option value="primary">主要责任</option>
                    <option value="secondary">次要责任</option>
                    <option value="none">无责任</option>
                </select>
            </div>
            <div class="field">
                <label for="confidence">置信度</label>
                <input id="confidence" name="confidence" type="number" min="0" max="100" step="0.01">
            </div>
            <div class="field">
                <label for="analystId">分析人</label>
                <select id="analystId" name="analystId"></select>
            </div>
            <div class="field" style="grid-column: 1 / -1;">
                <label for="analysisBasis">分析依据</label>
                <textarea id="analysisBasis" name="analysisBasis" placeholder="输入分析依据"></textarea>
            </div>
            <div class="field" style="grid-column: 1 / -1;">
                <label for="suggestion">建议</label>
                <textarea id="suggestion" name="suggestion" placeholder="输入整改建议"></textarea>
            </div>
        </form>
        <div class="dialog-actions">
            <button class="btn btn-secondary" type="button" data-close="editDialog">取消</button>
            <button class="btn btn-primary" type="button" id="saveBtn">保存</button>
        </div>
    </div>
</dialog>

<dialog id="detailDialog">
    <div class="dialog-body">
        <div class="dialog-header">
            <h3>归因详情</h3>
            <button class="btn btn-ghost btn-sm" type="button" data-close="detailDialog">关闭</button>
        </div>
        <div class="detail-grid" id="detailInfo"></div>
    </div>
</dialog>

<script src="/assets/common.js"></script>
<script>
    const state = { pageNum: 1, pageSize: 10 };
    let lossRecords = [];

    function statusBadge(status) {
        const map = {
            confirmed: '<span class="badge badge-success">已确认</span>',
            appealed: '<span class="badge badge-warning">已申诉</span>',
            revised: '<span class="badge badge-primary">已修订</span>',
        };
        return map[status] || Common.escapeHtml(status || "-");
    }

    function levelBadge(level) {
        const map = {
            primary: '<span class="badge badge-danger">主要责任</span>',
            secondary: '<span class="badge badge-warning">次要责任</span>',
            none: '<span class="badge badge-success">无责任</span>',
        };
        return map[level] || Common.escapeHtml(level || "-");
    }

    function collectSearch() {
        const form = document.getElementById("searchForm");
        return {
            pageNum: state.pageNum,
            pageSize: state.pageSize,
            batchNo: form.batchNo.value,
            responsibilityType: form.responsibilityType.value,
            responsibilityLevel: form.responsibilityLevel.value,
            status: form.status.value,
        };
    }

    async function loadLosses() {
        lossRecords = await Common.get("/loss/list");
        Common.renderOptions(
            document.getElementById("lossId"),
            lossRecords,
            (item) => `<option value="${item.id}">${Common.escapeHtml(item.batchNo)} - ${Common.formatNumber(item.lossQuantity)}kg - ${Common.escapeHtml(item.lossType)}</option>`,
            "请选择损耗记录"
        );
        const params = new URLSearchParams(window.location.search);
        const lossId = params.get("lossId");
        if (lossId) {
            document.getElementById("lossId").value = lossId;
            Common.openDialog("editDialog");
        }
    }

    async function loadUsers() {
        const users = await Common.loadUsers();
        Common.renderOptions(
            document.getElementById("analystId"),
            users,
            (item) => `<option value="${item.id}">${Common.escapeHtml(item.realName)} (${Common.escapeHtml(item.username)})</option>`,
            "请选择分析人"
        );
    }

    async function loadTable() {
        const page = await Common.get("/attribution/page", collectSearch());
        const tbody = document.getElementById("tableBody");
        const records = page.records || [];
        if (!records.length) {
            tbody.innerHTML = '<tr><td colspan="9" class="empty">暂无数据</td></tr>';
        } else {
            tbody.innerHTML = records.map((item) => `
                <tr>
                    <td><span class="badge badge-primary">${Common.escapeHtml(item.batchNo)}</span></td>
                    <td class="danger">${Common.formatNumber(item.lossQuantity)} kg</td>
                    <td>${Common.escapeHtml(item.responsibleParty || "-")}</td>
                    <td>${Common.escapeHtml(item.responsibilityType || "-")}</td>
                    <td>${levelBadge(item.responsibilityLevel)}</td>
                    <td>${Common.formatNumber(item.confidence)}%</td>
                    <td>${Common.formatDateTime(item.analysisTime)}</td>
                    <td>${statusBadge(item.status)}</td>
                    <td>
                        <div class="table-actions">
                            <button class="btn btn-secondary btn-sm" type="button" onclick="viewDetail(${item.id})">详情</button>
                            <button class="btn btn-danger btn-sm" type="button" onclick="deleteAttribution(${item.id})">删除</button>
                        </div>
                    </td>
                </tr>
            `).join("");
        }
        Common.renderPager(document.getElementById("pagination"), page, (pageNum) => {
            state.pageNum = pageNum;
            loadTable().catch(showError);
        });
    }

    async function autoAnalyze() {
        const lossId = Common.must(document.getElementById("lossId").value, "请先选择损耗记录");
        const data = await Common.get(`/attribution/analyze/${lossId}`);
        document.getElementById("responsibleParty").value = data.responsibleParty || "";
        document.getElementById("responsibilityTypeField").value = data.responsibilityType || "";
        document.getElementById("responsibilityLevelField").value = data.responsibilityLevel || "";
        document.getElementById("confidence").value = data.confidence || "";
        document.getElementById("analysisBasis").value = data.analysisBasis || "";
        document.getElementById("suggestion").value = data.suggestion || "";
        alert("自动分析完成");
    }

    async function saveAttribution() {
        const form = document.getElementById("editForm");
        const lossId = Number(Common.must(form.lossId.value, "请选择损耗记录"));
        const loss = lossRecords.find((item) => Number(item.id) === lossId);
        if (!loss) {
            throw new Error("未找到损耗记录");
        }
        await Common.post("/attribution/add", {
            lossId,
            batchId: Number(loss.batchId),
            nodeId: Number(loss.nodeId),
            responsibleParty: Common.must(form.responsibleParty.value.trim(), "请输入责任方"),
            responsibilityType: Common.must(form.responsibilityType.value, "请选择责任类型"),
            responsibilityLevel: Common.must(form.responsibilityLevel.value, "请选择责任等级"),
            confidence: Number(Common.must(form.confidence.value, "请输入置信度")),
            analysisBasis: form.analysisBasis.value.trim(),
            suggestion: form.suggestion.value.trim(),
            analystId: Number(Common.must(form.analystId.value, "请选择分析人")),
        });
        form.reset();
        Common.closeDialog("editDialog");
        state.pageNum = 1;
        await loadLosses();
        await loadTable();
        alert("新增归因成功");
    }

    async function viewDetail(id) {
        const data = await Common.get("/attribution/detail", { id });
        document.getElementById("detailInfo").innerHTML = [
            ["批次号", data.batchNo],
            ["责任方", data.responsibleParty],
            ["责任类型", data.responsibilityType],
            ["责任等级", levelBadge(data.responsibilityLevel)],
            ["置信度", `${Common.formatNumber(data.confidence)}%`],
            ["分析人", data.analystName || "-"],
            ["损耗量", `${Common.formatNumber(data.lossQuantity)} kg`],
            ["分析时间", Common.formatDateTime(data.analysisTime)],
            ["状态", statusBadge(data.status)],
            ["分析依据", data.analysisBasis || "-"],
            ["建议", data.suggestion || data.improvementSuggestion || "-"],
        ].map(([label, value]) => `
            <div class="detail-item">
                <strong>${label}</strong>
                <div>${value}</div>
            </div>
        `).join("");
        Common.openDialog("detailDialog");
    }

    async function deleteAttribution(id) {
        if (!confirm("确认删除这条归因记录？")) {
            return;
        }
        await Common.del("/attribution/delete", { id });
        await loadTable();
        alert("删除成功");
    }

    function showError(error) {
        alert(error.message || "操作失败");
    }

    document.getElementById("searchForm").addEventListener("submit", (event) => {
        event.preventDefault();
        state.pageNum = 1;
        loadTable().catch(showError);
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
        document.getElementById("searchForm").reset();
        state.pageNum = 1;
        loadTable().catch(showError);
    });

    document.getElementById("openAddBtn").addEventListener("click", () => {
        document.getElementById("editForm").reset();
        Common.openDialog("editDialog");
    });

    document.getElementById("analyzeBtn").addEventListener("click", () => {
        autoAnalyze().catch(showError);
    });

    document.getElementById("saveBtn").addEventListener("click", () => {
        saveAttribution().catch(showError);
    });

    document.querySelectorAll("[data-close]").forEach((button) => {
        button.addEventListener("click", () => Common.closeDialog(button.dataset.close));
    });

    Common.setClock();
    Promise.all([loadLosses(), loadUsers()]).then(loadTable).catch(showError);
</script>
</body>
</html>
