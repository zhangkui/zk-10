<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>追溯链路</title>
    <link rel="stylesheet" href="/assets/common.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="brand">
            <h1>冷链损耗分析</h1>
            <p>农产品冷链损耗归因分析系统</p>
        </div>
        <nav class="nav">
            <a href="/index.html">数据概览</a>
            <a href="/batch.html">批次管理</a>
            <a href="/flow.html">流转记录</a>
            <a href="/loss.html">损耗记录</a>
            <a href="/attribution.html">归因分析</a>
            <a href="/trace.html" class="active">追溯链路</a>
            <a href="/node.html">节点管理</a>
            <a href="/product.html">产品管理</a>
        </nav>
    </aside>

    <main class="main">
        <section class="topbar">
            <div>
                <h2>追溯链路</h2>
                <div class="meta">查看批次基础信息、流转、损耗和归因时间线</div>
            </div>
            <div class="d-flex align-items-center">
                <div class="meta me-3" id="currentTime"></div>
                <div id="userInfo"></div>
            </div>
        </section>

        <section class="panel">
            <div class="form-grid">
                <div class="field">
                    <label for="batchId">选择批次</label>
                    <select id="batchId"></select>
                </div>
                <div class="actions">
                    <button class="btn btn-primary" type="button" id="loadBtn">查看追溯</button>
                </div>
            </div>
        </section>

        <section class="cards" id="summaryCards" style="display: none;">
            <div class="card">
                <div class="label">批次号</div>
                <div class="value" id="summaryBatchNo">-</div>
            </div>
            <div class="card">
                <div class="label">产品名称</div>
                <div class="value" id="summaryProduct">-</div>
            </div>
            <div class="card">
                <div class="label">批次数量</div>
                <div class="value" id="summaryQuantity">-</div>
            </div>
            <div class="card">
                <div class="label">损耗率</div>
                <div class="value" id="summaryLossRate">-</div>
            </div>
        </section>

        <section class="grid-2" id="traceContent" style="display: none; margin-top: 20px;">
            <div class="panel">
                <div class="panel-header">
                    <h3>流转链路</h3>
                </div>
                <div class="list" id="flowList"></div>
            </div>
            <div class="panel">
                <div class="panel-header">
                    <h3>事件时间线</h3>
                </div>
                <div class="timeline" id="timeline"></div>
            </div>
        </section>

        <section class="panel" id="emptyPanel">
            <div class="empty">请选择批次查看追溯链路</div>
        </section>
    </main>
</div>

<script src="/assets/common.js"></script>
<script>
    async function loadBatches() {
        const batches = await Common.get("/batch/list");
        Common.renderOptions(
            document.getElementById("batchId"),
            batches,
            (item) => `<option value="${item.id}">${Common.escapeHtml(item.batchNo)} - ${Common.escapeHtml(item.productName)}</option>`,
            "请选择批次"
        );
        const params = new URLSearchParams(window.location.search);
        const batchId = params.get("batchId");
        if (batchId) {
            document.getElementById("batchId").value = batchId;
            await loadTrace();
        }
    }

    function renderSummary(batch) {
        document.getElementById("summaryBatchNo").textContent = batch.batchNo || "-";
        document.getElementById("summaryProduct").textContent = batch.productName || "-";
        document.getElementById("summaryQuantity").textContent = `${Common.formatNumber(batch.quantity)} kg`;
        document.getElementById("summaryLossRate").textContent = `${Common.formatNumber(batch.lossRate)}%`;
    }

    function renderFlows(flows) {
        const target = document.getElementById("flowList");
        if (!flows.length) {
            target.innerHTML = '<div class="empty">暂无流转记录</div>';
            return;
        }
        target.innerHTML = flows.map((item) => `
            <div class="list-item">
                <div class="stat-row">
                    <strong>${Common.escapeHtml(item.sourceNodeName || "起点")} -> ${Common.escapeHtml(item.targetNodeName || "终点")}</strong>
                    <span class="badge badge-primary">${Common.formatNumber(item.flowQuantity ?? item.quantity)} kg</span>
                </div>
                <div class="muted">时间：${Common.formatDateTime(item.operateTime)}，温度：${item.transportTemperature === null || item.transportTemperature === undefined ? "-" : `${Common.formatNumber(item.transportTemperature)}℃`}</div>
            </div>
        `).join("");
    }

    function renderTimeline(batch, flows, losses, attributions) {
        const target = document.getElementById("timeline");
        const items = [];
        items.push(`
            <div class="timeline-item">
                <strong>批次创建</strong>
                <div class="muted">${Common.formatDateTime(batch.createTime)}</div>
                <div>产品：${Common.escapeHtml(batch.productName || "-")}，数量：${Common.formatNumber(batch.quantity)} kg</div>
            </div>
        `);

        flows.forEach((flow) => {
            items.push(`
                <div class="timeline-item">
                    <strong>流转记录</strong>
                    <div class="muted">${Common.formatDateTime(flow.operateTime)}</div>
                    <div>${Common.escapeHtml(flow.sourceNodeName || "起点")} -> ${Common.escapeHtml(flow.targetNodeName || "终点")}，数量 ${Common.formatNumber(flow.flowQuantity ?? flow.quantity)} kg</div>
                </div>
            `);
        });

        losses.forEach((loss) => {
            const attribution = attributions.find((item) => Number(item.lossId) === Number(loss.id));
            items.push(`
                <div class="timeline-item loss">
                    <strong>损耗记录</strong>
                    <div class="muted">${Common.formatDateTime(loss.discoverTime)}</div>
                    <div>节点：${Common.escapeHtml(loss.nodeName || "-")}，损耗 ${Common.formatNumber(loss.lossQuantity)} kg，类型：${Common.escapeHtml(loss.lossType || "-")}</div>
                    <div>原因：${Common.escapeHtml(loss.lossReason || "-")}</div>
                    ${attribution ? `<div style="margin-top: 8px;">归因：${Common.escapeHtml(attribution.responsibleParty || "-")} / ${Common.escapeHtml(attribution.responsibilityType || "-")} / ${Common.formatNumber(attribution.confidence)}%</div>` : ""}
                </div>
            `);
        });

        target.innerHTML = items.join("");
    }

    async function loadTrace() {
        const batchId = document.getElementById("batchId").value;
        if (!batchId) {
            return;
        }
        const data = await Common.get(`/batch/${batchId}/trace`);
        renderSummary(data.batch || {});
        renderFlows(data.flows || []);
        renderTimeline(data.batch || {}, data.flows || [], data.losses || [], data.attributions || []);
        document.getElementById("summaryCards").style.display = "grid";
        document.getElementById("traceContent").style.display = "grid";
        document.getElementById("emptyPanel").style.display = "none";
    }

    function showError(error) {
        alert(error.message || "加载失败");
    }

    document.getElementById("loadBtn").addEventListener("click", () => {
        loadTrace().catch(showError);
    });

    Common.checkLogin();
    Common.renderUserInfo();
    Common.setClock();
    loadBatches().catch(showError);
</script>
</body>
</html>
