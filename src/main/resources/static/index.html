<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据概览</title>
    <link rel="stylesheet" href="/assets/common.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="brand">
            <h1>冷链损耗分析</h1>
            <p>农产品冷链损耗归因分析系统</p>
        </div>
        <nav class="nav">
            <a href="/index.html" class="active">数据概览</a>
            <a href="/batch.html">批次管理</a>
            <a href="/flow.html">流转记录</a>
            <a href="/loss.html">损耗记录</a>
            <a href="/attribution.html">归因分析</a>
            <a href="/trace.html">追溯链路</a>
            <a href="/node.html">节点管理</a>
            <a href="/product.html">产品管理</a>
        </nav>
    </aside>

    <main class="main">
        <section class="topbar">
            <div>
                <h2>数据概览</h2>
                <div class="meta">展示冷链批次、损耗和归因的核心统计</div>
            </div>
            <div class="meta" id="currentTime"></div>
        </section>

        <section class="cards">
            <div class="card">
                <div class="label">总批次数</div>
                <div class="value" id="totalBatchCount">-</div>
            </div>
            <div class="card">
                <div class="label">总损耗量</div>
                <div class="value" id="totalLossQuantity">-</div>
            </div>
            <div class="card">
                <div class="label">平均损耗率</div>
                <div class="value" id="avgLossRate">-</div>
            </div>
            <div class="card">
                <div class="label">活跃节点数</div>
                <div class="value" id="activeNodeCount">-</div>
            </div>
        </section>

        <section class="grid-2" style="margin-top: 20px;">
            <div class="panel">
                <div class="panel-header">
                    <h3>按分类损耗</h3>
                </div>
                <div class="list" id="lossByCategory"></div>
            </div>
            <div class="panel">
                <div class="panel-header">
                    <h3>按节点损耗</h3>
                </div>
                <div class="list" id="lossByNode"></div>
            </div>
        </section>

        <section class="grid-2">
            <div class="panel">
                <div class="panel-header">
                    <h3>损耗趋势</h3>
                </div>
                <div class="list" id="lossTrend"></div>
            </div>
            <div class="panel">
                <div class="panel-header">
                    <h3>责任类型统计</h3>
                </div>
                <div class="list" id="lossByResponsibility"></div>
            </div>
        </section>

        <section class="panel">
            <div class="panel-header">
                <h3>最近损耗记录</h3>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>批次号</th>
                        <th>产品</th>
                        <th>损耗数量</th>
                        <th>损耗率</th>
                        <th>类型</th>
                        <th>状态</th>
                        <th>发现时间</th>
                    </tr>
                    </thead>
                    <tbody id="recentLossTable"></tbody>
                </table>
            </div>
        </section>
    </main>
</div>

<script src="/assets/common.js"></script>
<script>
    function statusBadge(status) {
        const map = {
            pending: '<span class="badge badge-warning">待处理</span>',
            processed: '<span class="badge badge-primary">已处理</span>',
            attributed: '<span class="badge badge-success">已归因</span>',
        };
        return map[status] || Common.escapeHtml(status || "-");
    }

    function renderList(targetId, rows, formatter) {
        const target = document.getElementById(targetId);
        if (!rows.length) {
            target.innerHTML = '<div class="empty">暂无数据</div>';
            return;
        }
        target.innerHTML = rows.map(formatter).join("");
    }

    async function loadOverview() {
        const data = await Common.get("/report/overview");
        document.getElementById("totalBatchCount").textContent = data.totalBatchCount ?? 0;
        document.getElementById("totalLossQuantity").textContent = `${Common.formatNumber(data.totalLossQuantity)} kg`;
        document.getElementById("avgLossRate").textContent = `${Common.formatNumber(data.avgLossRate)}%`;
        document.getElementById("activeNodeCount").textContent = data.activeNodeCount ?? 0;
    }

    async function loadCategory() {
        const data = await Common.get("/report/lossByCategory");
        renderList("lossByCategory", data, (item) => `
            <div class="list-item">
                <div class="stat-row">
                    <strong>${Common.escapeHtml(item.category || item.name || "-")}</strong>
                    <span class="badge badge-primary">${Common.formatNumber(item.lossQuantity ?? item.value)} kg</span>
                </div>
            </div>
        `);
    }

    async function loadNode() {
        const data = await Common.get("/report/lossByNode");
        renderList("lossByNode", data, (item) => `
            <div class="list-item">
                <div class="stat-row">
                    <strong>${Common.escapeHtml(item.nodeName || item.name || "-")}</strong>
                    <span class="badge badge-warning">${Common.formatNumber(item.lossQuantity ?? item.value)} kg</span>
                </div>
            </div>
        `);
    }

    async function loadTrend() {
        const data = await Common.get("/report/lossTrend", { days: 7 });
        renderList("lossTrend", data, (item) => `
            <div class="list-item">
                <div class="stat-row">
                    <strong>${Common.escapeHtml(item.date)}</strong>
                    <span class="badge badge-danger">${Common.formatNumber(item.lossQuantity)} kg</span>
                </div>
            </div>
        `);
    }

    async function loadResponsibility() {
        const data = await Common.get("/report/lossByResponsibility");
        renderList("lossByResponsibility", data, (item) => `
            <div class="list-item">
                <div class="stat-row">
                    <strong>${Common.escapeHtml(item.responsibilityType || item.name || "-")}</strong>
                    <span class="badge badge-success">${Common.formatNumber(item.lossQuantity ?? item.value)} kg</span>
                </div>
            </div>
        `);
    }

    async function loadRecentLoss() {
        const page = await Common.get("/loss/page", { pageNum: 1, pageSize: 5 });
        const records = page.records || [];
        const tbody = document.getElementById("recentLossTable");
        if (!records.length) {
            tbody.innerHTML = '<tr><td colspan="7" class="empty">暂无数据</td></tr>';
            return;
        }
        tbody.innerHTML = records.map((item) => `
            <tr>
                <td><span class="badge badge-primary">${Common.escapeHtml(item.batchNo)}</span></td>
                <td>${Common.escapeHtml(item.productName || "-")}</td>
                <td class="danger">${Common.formatNumber(item.lossQuantity)}</td>
                <td>${Common.formatNumber(item.lossRate)}%</td>
                <td>${Common.escapeHtml(item.lossType || "-")}</td>
                <td>${statusBadge(item.status)}</td>
                <td>${Common.formatDateTime(item.discoverTime)}</td>
            </tr>
        `).join("");
    }

    function showError(error) {
        alert(error.message || "加载失败");
    }

    Common.setClock();
    Promise.all([
        loadOverview(),
        loadCategory(),
        loadNode(),
        loadTrend(),
        loadResponsibility(),
        loadRecentLoss(),
    ]).catch(showError);
</script>
</body>
</html>
