<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>农产品冷链损耗归因分析系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: #f0f2f5; }
        .sidebar {
            width: 220px;
            height: 100vh;
            background: linear-gradient(180deg, #001529 0%, #002140 100%);
            position: fixed;
            left: 0;
            top: 0;
            color: #fff;
            padding-top: 20px;
        }
        .sidebar .logo {
            text-align: center;
            padding: 20px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }
        .sidebar .logo h4 { font-size: 16px; font-weight: bold; margin: 0; }
        .sidebar .logo p { font-size: 12px; opacity: 0.7; margin: 5px 0 0; }
        .sidebar .menu { list-style: none; }
        .sidebar .menu li { padding: 0; }
        .sidebar .menu li a {
            display: block;
            padding: 14px 25px;
            color: rgba(255,255,255,0.75);
            text-decoration: none;
            transition: all 0.3s;
            border-left: 3px solid transparent;
        }
        .sidebar .menu li a:hover,
        .sidebar .menu li a.active {
            background: rgba(24, 144, 255, 0.2);
            color: #fff;
            border-left-color: #1890ff;
        }
        .sidebar .menu li a i { margin-right: 10px; }
        .main-content {
            margin-left: 220px;
            padding: 20px;
        }
        .header {
            background: #fff;
            padding: 15px 25px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .header h3 { margin: 0; color: #333; }
        .stat-cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.1);
        }
        .stat-card .icon {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 15px;
        }
        .stat-card.blue .icon { background: #e6f7ff; color: #1890ff; }
        .stat-card.red .icon { background: #fff1f0; color: #f5222d; }
        .stat-card.green .icon { background: #f6ffed; color: #52c41a; }
        .stat-card.orange .icon { background: #fff7e6; color: #fa8c16; }
        .stat-card .label { font-size: 14px; color: #666; margin-bottom: 5px; }
        .stat-card .value { font-size: 28px; font-weight: bold; color: #333; }
        .stat-card .trend { font-size: 12px; margin-top: 5px; }
        .stat-card .trend.up { color: #52c41a; }
        .stat-card .trend.down { color: #f5222d; }
        .chart-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .chart-box {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .chart-box h5 {
            margin: 0 0 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
            color: #333;
        }
        .chart {
            width: 100%;
            height: 320px;
        }
        .table-box {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .table-box h5 {
            margin: 0 0 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
            color: #333;
        }
        .badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: normal;
        }
        .badge-success { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; }
        .badge-warning { background: #fffbe6; color: #faad14; border: 1px solid #ffe58f; }
        .badge-danger { background: #fff1f0; color: #f5222d; border: 1px solid #ffa39e; }
        .badge-info { background: #e6f7ff; color: #1890ff; border: 1px solid #91d5ff; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <h4><i class="bi bi-snow2"></i> 冷链损耗分析</h4>
            <p>Cold Chain Loss Analysis</p>
        </div>
        <ul class="menu">
            <li><a href="index.html" class="active"><i class="bi bi-speedometer2"></i> 数据概览</a></li>
            <li><a href="batch.html"><i class="bi bi-box-seam"></i> 批次管理</a></li>
            <li><a href="flow.html"><i class="bi bi-arrow-left-right"></i> 流转记录</a></li>
            <li><a href="loss.html"><i class="bi bi-exclamation-triangle"></i> 损耗记录</a></li>
            <li><a href="attribution.html"><i class="bi bi-search"></i> 归因分析</a></li>
            <li><a href="trace.html"><i class="bi bi-diagram-3"></i> 可视化追溯</a></li>
            <li><a href="node.html"><i class="bi bi-geo-alt"></i> 节点管理</a></li>
            <li><a href="product.html"><i class="bi bi-bag"></i> 产品管理</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header">
            <h3><i class="bi bi-speedometer2"></i> 数据概览 Dashboard</h3>
            <div>
                <span class="text-muted">当前用户：管理员</span>
                <span class="text-muted ms-3" id="currentTime"></span>
            </div>
        </div>

        <div class="stat-cards">
            <div class="stat-card blue">
                <div class="icon"><i class="bi bi-box-seam"></i></div>
                <div class="label">总批次数量</div>
                <div class="value" id="totalBatch">--</div>
                <div class="trend up"><i class="bi bi-arrow-up"></i> 本月新增 12 批次</div>
            </div>
            <div class="stat-card red">
                <div class="icon"><i class="bi bi-droplet-half"></i></div>
                <div class="label">总损耗量</div>
                <div class="value" id="totalLoss">--</div>
                <div class="trend down"><i class="bi bi-arrow-down"></i> 较上月下降 5.2%</div>
            </div>
            <div class="stat-card orange">
                <div class="icon"><i class="bi bi-percent"></i></div>
                <div class="label">平均损耗率</div>
                <div class="value" id="avgLossRate">--</div>
                <div class="trend down"><i class="bi bi-arrow-down"></i> 较上月下降 0.8%</div>
            </div>
            <div class="stat-card green">
                <div class="icon"><i class="bi bi-geo-alt"></i></div>
                <div class="label">活跃节点</div>
                <div class="value" id="activeNode">--</div>
                <div class="trend up"><i class="bi bi-arrow-up"></i> 正常运行中</div>
            </div>
        </div>

        <div class="chart-row">
            <div class="chart-box">
                <h5><i class="bi bi-graph-up"></i> 损耗趋势分析（近30天）</h5>
                <div id="trendChart" class="chart"></div>
            </div>
            <div class="chart-box">
                <h5><i class="bi bi-pie-chart"></i> 产品分类损耗占比</h5>
                <div id="categoryChart" class="chart"></div>
            </div>
        </div>

        <div class="chart-row">
            <div class="chart-box">
                <h5><i class="bi bi-bar-chart"></i> 各节点损耗统计</h5>
                <div id="nodeChart" class="chart"></div>
            </div>
            <div class="chart-box">
                <h5><i class="bi bi-pie-chart-fill"></i> 损耗类型分布</h5>
                <div id="typeChart" class="chart"></div>
            </div>
        </div>

        <div class="chart-row">
            <div class="chart-box">
                <h5><i class="bi bi-bar-chart-fill"></i> 责任类型统计</h5>
                <div id="responsibilityChart" class="chart"></div>
            </div>
            <div class="table-box">
                <h5><i class="bi bi-list-task"></i> 最近损耗记录</h5>
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>批次号</th>
                            <th>产品</th>
                            <th>损耗量(kg)</th>
                            <th>损耗率</th>
                            <th>类型</th>
                            <th>状态</th>
                            <th>发现时间</th>
                        </tr>
                    </thead>
                    <tbody id="recentLossTable">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        axios.defaults.baseURL = API_BASE;

        function updateTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent = now.toLocaleString('zh-CN');
        }
        setInterval(updateTime, 1000);
        updateTime();

        async function loadOverview() {
            try {
                const res = await axios.get('/report/overview');
                const data = res.data.data;
                document.getElementById('totalBatch').textContent = data.totalBatchCount;
                document.getElementById('totalLoss').textContent = data.totalLossQuantity + ' kg';
                document.getElementById('avgLossRate').textContent = data.avgLossRate + ' %';
                document.getElementById('activeNode').textContent = data.activeNodeCount;
            } catch (e) {
                console.error('加载概览数据失败', e);
            }
        }

        async function loadTrendChart() {
            const res = await axios.get('/report/lossTrend?days=30');
            const data = res.data.data;
            const chart = echarts.init(document.getElementById('trendChart'));
            chart.setOption({
                tooltip: { trigger: 'axis' },
                legend: { data: ['损耗量(kg)', '损耗率(%)'] },
                grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
                xAxis: {
                    type: 'category',
                    boundaryGap: false,
                    data: data.map(d => d.date)
                },
                yAxis: [
                    { type: 'value', name: '损耗量(kg)' },
                    { type: 'value', name: '损耗率(%)' }
                ],
                series: [
                    {
                        name: '损耗量(kg)',
                        type: 'line',
                        smooth: true,
                        data: data.map(d => d.lossQuantity),
                        itemStyle: { color: '#f5222d' },
                        areaStyle: { color: 'rgba(245, 34, 45, 0.1)' }
                    },
                    {
                        name: '损耗率(%)',
                        type: 'line',
                        smooth: true,
                        yAxisIndex: 1,
                        data: data.map(d => d.lossRate),
                        itemStyle: { color: '#fa8c16' }
                    }
                ]
            });
        }

        async function loadCategoryChart() {
            const res = await axios.get('/report/lossByCategory');
            const data = res.data.data;
            const chart = echarts.init(document.getElementById('categoryChart'));
            const colors = ['#1890ff', '#52c41a', '#faad14', '#f5222d', '#722ed1'];
            chart.setOption({
                tooltip: { trigger: 'item', formatter: '{b}: {c}kg ({d}%)' },
                legend: { orient: 'vertical', left: 'left' },
                series: [{
                    type: 'pie',
                    radius: ['40%', '70%'],
                    avoidLabelOverlap: false,
                    itemStyle: { borderRadius: 8, borderColor: '#fff', borderWidth: 2 },
                    label: { show: true, formatter: '{b}\n{d}%' },
                    data: data.map((d, i) => ({
                        value: d.lossQuantity,
                        name: d.category,
                        itemStyle: { color: colors[i % colors.length] }
                    }))
                }]
            });
        }

        async function loadNodeChart() {
            const res = await axios.get('/report/lossByNode');
            const data = res.data.data;
            const chart = echarts.init(document.getElementById('nodeChart'));
            chart.setOption({
                tooltip: { trigger: 'axis' },
                grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
                xAxis: {
                    type: 'category',
                    data: data.map(d => d.nodeName),
                    axisLabel: { rotate: 30, interval: 0 }
                },
                yAxis: { type: 'value', name: '损耗量(kg)' },
                series: [{
                    type: 'bar',
                    data: data.map(d => d.lossQuantity),
                    itemStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: '#1890ff' },
                            { offset: 1, color: '#91d5ff' }
                        ]),
                        borderRadius: [4, 4, 0, 0]
                    },
                    barWidth: '50%'
                }]
            });
        }

        async function loadTypeChart() {
            const res = await axios.get('/report/lossByType');
            const data = res.data.data;
            const chart = echarts.init(document.getElementById('typeChart'));
            const colors = ['#f5222d', '#fa8c16', '#faad14', '#52c41a'];
            chart.setOption({
                tooltip: { trigger: 'item', formatter: '{b}: {c}kg ({d}%)' },
                legend: { orient: 'vertical', left: 'left' },
                series: [{
                    type: 'pie',
                    radius: '60%',
                    center: ['55%', '50%'],
                    data: data.map((d, i) => ({
                        value: d.lossQuantity,
                        name: d.lossType,
                        itemStyle: { color: colors[i % colors.length] }
                    })),
                    emphasis: {
                        itemStyle: {
                            shadowBlur: 10,
                            shadowOffsetX: 0,
                            shadowColor: 'rgba(0, 0, 0, 0.5)'
                        }
                    }
                }]
            });
        }

        async function loadResponsibilityChart() {
            const res = await axios.get('/report/lossByResponsibility');
            const data = res.data.data;
            const chart = echarts.init(document.getElementById('responsibilityChart'));
            chart.setOption({
                tooltip: { trigger: 'axis' },
                grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
                xAxis: {
                    type: 'category',
                    data: data.map(d => d.responsibilityType),
                    axisLabel: { rotate: 20, interval: 0 }
                },
                yAxis: { type: 'value', name: '损耗量(kg)' },
                series: [{
                    type: 'bar',
                    data: data.map(d => d.lossQuantity),
                    itemStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: '#722ed1' },
                            { offset: 1, color: '#b37feb' }
                        ]),
                        borderRadius: [4, 4, 0, 0]
                    },
                    barWidth: '50%'
                }]
            });
        }

        async function loadRecentLoss() {
            const res = await axios.get('/loss/page?pageNum=1&pageSize=5');
            const data = res.data.data.records;
            const tbody = document.getElementById('recentLossTable');
            tbody.innerHTML = data.map(item => `
                <tr>
                    <td><span class="badge badge-info">${item.batchNo}</span></td>
                    <td>${item.productName}</td>
                    <td class="text-danger fw-bold">${item.lossQuantity}</td>
                    <td>${item.lossRate}%</td>
                    <td>${item.lossType}</td>
                    <td>${item.status === 'processed' ? 
                        '<span class="badge badge-success">已处理</span>' : 
                        '<span class="badge badge-warning">待处理</span>'}</td>
                    <td>${item.discoverTime}</td>
                </tr>
            `).join('');
        }

        window.addEventListener('resize', () => {
            document.querySelectorAll('.chart').forEach(el => {
                const instance = echarts.getInstanceByDom(el);
                if (instance) instance.resize();
            });
        });

        (async function init() {
            await loadOverview();
            await loadTrendChart();
            await loadCategoryChart();
            await loadNodeChart();
            await loadTypeChart();
            await loadResponsibilityChart();
            await loadRecentLoss();
        })();
    </script>
</body>
</html>
