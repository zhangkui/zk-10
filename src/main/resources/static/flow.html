<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流转记录</title>
    <link rel="stylesheet" href="/assets/common.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="brand">
            <h1>冷链损耗分析</h1>
            <p>农产品冷链损耗归因分析系统</p>
        </div>
        <nav class="nav">
            <a href="/index.html">数据概览</a>
            <a href="/batch.html">批次管理</a>
            <a href="/flow.html" class="active">流转记录</a>
            <a href="/loss.html">损耗记录</a>
            <a href="/attribution.html">归因分析</a>
            <a href="/trace.html">追溯链路</a>
            <a href="/node.html">节点管理</a>
            <a href="/product.html">产品管理</a>
        </nav>
    </aside>

    <main class="main">
        <section class="topbar">
            <div>
                <h2>流转记录</h2>
                <div class="meta">查询批次流转轨迹并登记新的流转记录</div>
            </div>
            <div class="d-flex align-items-center">
                <div class="meta me-3" id="currentTime"></div>
                <div id="userInfo"></div>
            </div>
        </section>

        <section class="panel">
            <form id="searchForm" class="form-grid">
                <div class="field">
                    <label for="batchNo">批次号</label>
                    <input id="batchNo" name="batchNo" placeholder="输入批次号">
                </div>
                <div class="field">
                    <label for="nodeId">节点</label>
                    <select id="nodeId" name="nodeId"></select>
                </div>
                <div class="field">
                    <label for="startDate">开始日期</label>
                    <input id="startDate" name="startDate" type="date">
                </div>
                <div class="field">
                    <label for="endDate">结束日期</label>
                    <input id="endDate" name="endDate" type="date">
                </div>
                <div class="actions">
                    <button class="btn btn-primary" type="submit">查询</button>
                    <button class="btn btn-secondary" type="button" id="resetBtn">重置</button>
                </div>
            </form>
        </section>

        <section class="panel">
            <div class="panel-header">
                <h3>流转列表</h3>
                <button class="btn btn-primary" type="button" id="openAddBtn">新增流转</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>批次号</th>
                        <th>来源节点</th>
                        <th>目标节点</th>
                        <th>流转数量</th>
                        <th>操作人</th>
                        <th>操作时间</th>
                        <th>运输温度</th>
                        <th>运输时长</th>
                    </tr>
                    </thead>
                    <tbody id="flowTable"></tbody>
                </table>
            </div>
            <div class="pagination" id="pagination"></div>
        </section>
    </main>
</div>

<dialog id="editDialog">
    <div class="dialog-body">
        <div class="dialog-header">
            <h3>新增流转记录</h3>
            <button class="btn btn-ghost btn-sm" type="button" data-close="editDialog">关闭</button>
        </div>
        <form id="editForm" class="form-grid">
            <div class="field">
                <label for="batchId">批次</label>
                <select id="batchId" name="batchId"></select>
            </div>
            <div class="field">
                <label for="fromNodeId">来源节点</label>
                <select id="fromNodeId" name="fromNodeId"></select>
            </div>
            <div class="field">
                <label for="toNodeId">目标节点</label>
                <select id="toNodeId" name="toNodeId"></select>
            </div>
            <div class="field">
                <label for="flowQuantity">流转数量</label>
                <input id="flowQuantity" name="flowQuantity" type="number" step="0.01" min="0.01">
            </div>
            <div class="field">
                <label for="operatorId">操作人</label>
                <select id="operatorId" name="operatorId"></select>
            </div>
            <div class="field">
                <label for="operateTime">操作时间</label>
                <input id="operateTime" name="operateTime" type="datetime-local">
            </div>
            <div class="field">
                <label for="temperature">运输温度</label>
                <input id="temperature" name="temperature" type="number" step="0.01">
            </div>
            <div class="field">
                <label for="transportDuration">运输时长（分钟）</label>
                <input id="transportDuration" name="transportDuration" type="number" min="0">
            </div>
            <div class="field" style="grid-column: 1 / -1;">
                <label for="remark">备注</label>
                <textarea id="remark" name="remark" placeholder="输入备注"></textarea>
            </div>
        </form>
        <div class="dialog-actions">
            <button class="btn btn-secondary" type="button" data-close="editDialog">取消</button>
            <button class="btn btn-primary" type="button" id="saveBtn">保存</button>
        </div>
    </div>
</dialog>

<script src="/assets/common.js"></script>
<script>
    const state = {
        pageNum: 1,
        pageSize: 10,
    };

    function collectSearch() {
        const form = document.getElementById("searchForm");
        return {
            pageNum: state.pageNum,
            pageSize: state.pageSize,
            batchNo: form.batchNo.value,
            nodeId: form.nodeId.value,
            startDate: form.startDate.value,
            endDate: form.endDate.value,
        };
    }

    async function loadNodes() {
        const nodes = await Common.get("/node/list");
        const render = (item) => `<option value="${item.id}">${Common.escapeHtml(item.nodeName)}</option>`;
        Common.renderOptions(document.getElementById("nodeId"), nodes, render, "全部节点");
        Common.renderOptions(document.getElementById("fromNodeId"), nodes, render, "请选择来源节点");
        Common.renderOptions(document.getElementById("toNodeId"), nodes, render, "请选择目标节点");
    }

    async function loadBatches() {
        const batches = await Common.get("/batch/list");
        Common.renderOptions(
            document.getElementById("batchId"),
            batches,
            (item) => `<option value="${item.id}">${Common.escapeHtml(item.batchNo)} - ${Common.escapeHtml(item.productName)}</option>`,
            "请选择批次"
        );
    }

    async function loadUsers() {
        const users = await Common.loadUsers();
        Common.renderOptions(
            document.getElementById("operatorId"),
            users,
            (item) => `<option value="${item.id}">${Common.escapeHtml(item.realName)} (${Common.escapeHtml(item.username)})</option>`,
            "请选择操作人"
        );
    }

    async function loadTable() {
        const page = await Common.get("/flow/page", collectSearch());
        const tbody = document.getElementById("flowTable");
        const records = page.records || [];
        if (!records.length) {
            tbody.innerHTML = '<tr><td colspan="8" class="empty">暂无数据</td></tr>';
        } else {
            tbody.innerHTML = records.map((item) => `
                <tr>
                    <td><span class="badge badge-primary">${Common.escapeHtml(item.batchNo)}</span></td>
                    <td>${Common.escapeHtml(item.sourceNodeName || "-")}</td>
                    <td>${Common.escapeHtml(item.targetNodeName || "-")}</td>
                    <td>${Common.formatNumber(item.flowQuantity ?? item.quantity)}</td>
                    <td>${Common.escapeHtml(item.operatorName || "-")}</td>
                    <td>${Common.formatDateTime(item.operateTime)}</td>
                    <td>${item.transportTemperature === null || item.transportTemperature === undefined ? "-" : `${Common.formatNumber(item.transportTemperature)}℃`}</td>
                    <td>${item.transportDuration === null || item.transportDuration === undefined ? "-" : `${item.transportDuration} 分钟`}</td>
                </tr>
            `).join("");
        }

        Common.renderPager(document.getElementById("pagination"), page, (pageNum) => {
            state.pageNum = pageNum;
            loadTable().catch(showError);
        });
    }

    async function saveFlow() {
        const form = document.getElementById("editForm");
        const fromNodeId = form.fromNodeId.value ? Number(form.fromNodeId.value) : null;
        const toNodeId = Number(Common.must(form.toNodeId.value, "请选择目标节点"));
        if (fromNodeId !== null && fromNodeId === toNodeId) {
            throw new Error("来源节点和目标节点不能相同");
        }
        await Common.post("/flow/add", {
            batchId: Number(Common.must(form.batchId.value, "请选择批次")),
            fromNodeId,
            toNodeId,
            flowQuantity: Number(Common.must(form.flowQuantity.value, "请输入流转数量")),
            operatorId: Number(Common.must(form.operatorId.value, "请选择操作人")),
            operateTime: form.operateTime.value || null,
            temperature: form.temperature.value === "" ? null : Number(form.temperature.value),
            transportDuration: form.transportDuration.value === "" ? null : Number(form.transportDuration.value),
            remark: form.remark.value.trim(),
        });
        form.reset();
        Common.closeDialog("editDialog");
        state.pageNum = 1;
        await loadTable();
        alert("新增流转成功");
    }

    function showError(error) {
        alert(error.message || "操作失败");
    }

    document.getElementById("searchForm").addEventListener("submit", (event) => {
        event.preventDefault();
        state.pageNum = 1;
        loadTable().catch(showError);
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
        document.getElementById("searchForm").reset();
        state.pageNum = 1;
        loadTable().catch(showError);
    });

    document.getElementById("openAddBtn").addEventListener("click", () => {
        const form = document.getElementById("editForm");
        form.reset();
        form.operateTime.value = Common.formatDateTimeInput(new Date().toISOString());
        Common.openDialog("editDialog");
    });

    document.getElementById("saveBtn").addEventListener("click", () => {
        saveFlow().catch(showError);
    });

    document.querySelectorAll("[data-close]").forEach((button) => {
        button.addEventListener("click", () => Common.closeDialog(button.dataset.close));
    });

    Common.checkLogin();
    Common.renderUserInfo();
    Common.setClock();
    Promise.all([loadNodes(), loadBatches(), loadUsers()]).then(loadTable).catch(showError);
</script>
</body>
</html>
